name: Android Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: MateKids-debug
          path: app/build/outputs/apk/debug/

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MateKids-release
          path: app/build/outputs/apk/release/

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Create Release with APKs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: MateKids v1.0.0 Build #${{ github.run_number }}
          body: |
            🎉 **MateKids v1.0.0** - Build #${{ github.run_number }}

            📦 **APKs Disponibles:**
            - `app-debug.apk` - Versión de desarrollo
            - `app-release-unsigned.apk` - Versión release

            **Plataforma:** Android 7.0+ (API 24)

            ✅ Build completado exitosamente
            🧪 Tests pasados

            [Ver cambios en GitHub](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with Build Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build completado exitosamente\n\n📦 APKs disponibles en Artifacts\n\n🔗 [Ver en GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })
