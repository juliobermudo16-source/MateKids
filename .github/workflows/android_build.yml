name: Android Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Debug
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Build APK Release
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      # Sin continue-on-error a proposito: si los tests fallan el build tiene
      # que ponerse en rojo. Con la marca puesta el CI salia verde durante
      # semanas mientras los tests ni siquiera compilaban.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: List Build Outputs
        if: always()
        run: |
          echo "=== Debug APK ==="
          find app/build/outputs/apk/debug -name "*.apk" -type f || echo "No debug APKs found"
          echo "=== Release APK ==="
          find app/build/outputs/apk/release -name "*.apk" -type f || echo "No release APKs found"

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MateKids-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MateKids-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create Release with APKs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: MateKids v1.0.0 Build #${{ github.run_number }}
          body: |
            🎉 **MateKids v1.0.0** - Build #${{ github.run_number }}

            📦 **APKs Disponibles:**
            - `app-debug.apk` - Versión de desarrollo
            - `app-release-unsigned.apk` - Versión release

            **Plataforma:** Android 7.0+ (API 24)

            ✅ Build completado exitosamente

            [Ver cambios en GitHub](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
